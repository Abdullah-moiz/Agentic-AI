[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-buddy"
version = "0.1.0"
description = "A tool-calling AI agent that tracks expenses from plain sentences."
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0",
    "langgraph>=1.0",
    "langchain-groq",
    "langchain-openai",
    "langchain-anthropic",
    "httpx",
    "python-dotenv",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
expense-buddy = "expense_buddy.cli:main"
expense-buddy-ui = "expense_buddy.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
expense_buddy = ["static/*"]
