<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Buddy</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1c2330; --muted: #6b7686;
    --line: #e3e7ee; --accent: #2f6fed; --accent-text: #ffffff;
    --user: #2f6fed; --bot: #eef1f6; --danger: #d6453d; --ok: #1f9d63;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1b2029; --text: #e6e9ef; --muted: #8b95a5;
      --line: #2a313d; --accent: #5b8cff; --accent-text: #0b1020;
      --user: #3b63c9; --bot: #252c38; --danger: #ef6b63; --ok: #3fc58a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { display: grid; grid-template-columns: 1fr 320px; gap: 16px;
         max-width: 1100px; margin: 0 auto; padding: 16px; height: 100vh; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .chat { display: flex; flex-direction: column; min-height: 0; }
  header { padding: 14px 18px; border-bottom: 1px solid var(--line);
           display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 17px; margin: 0; }
  header span { color: var(--muted); font-size: 13px; }
  #log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--user); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .steps { align-self: flex-start; max-width: 90%; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
           color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; word-break: break-word; }
  .approve { align-self: flex-start; border: 1px solid var(--danger); border-radius: 12px; padding: 12px 14px; }
  .approve p { margin: 0 0 10px; }
  .approve button { margin-right: 8px; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  input[type=text] { flex: 1; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--line);
                     background: var(--bg); color: var(--text); font: inherit; }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { font: inherit; padding: 9px 16px; border-radius: 10px; border: 1px solid var(--line);
           background: var(--panel); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  aside { padding: 16px; overflow-y: auto; }
  aside h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; }
  .total { font-size: 26px; font-weight: 650; margin-bottom: 4px; }
  .row { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .row small { color: var(--muted); display: block; }
  .section { margin-bottom: 22px; }
  .empty { color: var(--muted); font-size: 14px; }
  @media (max-width: 800px) { .app { grid-template-columns: 1fr; height: auto; } .chat { height: 80vh; } }
</style>
</head>
<body>
<div class="app">
  <main class="card chat">
    <header><h1>Expense Buddy</h1><span>Try: "spent 1200 on lunch and 300 on uber today"</span></header>
    <div id="log" aria-live="polite"></div>
    <form id="form">
      <input id="input" type="text" placeholder="Tell me what you spent..." autocomplete="off" autofocus>
      <button class="primary" id="send">Send</button>
    </form>
  </main>

  <aside class="card">
    <div class="section">
      <h2>This month</h2>
      <div class="total" id="total">PKR 0</div>
      <div id="categories"></div>
    </div>
    <div class="section">
      <h2>Recent expenses</h2>
      <div id="recent"></div>
    </div>
  </aside>
</div>

<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  let threadId = null;

  const pkr = n => "PKR " + Math.round(n).toLocaleString("en-US");

  // Everything is added with textContent, never innerHTML, so model output can't inject markup.
  function add(cls, text) {
    const el = document.createElement("div");
    el.className = cls;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  async function api(path, body) {
    const res = await fetch(path, body ? {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    } : undefined);
    if (!res.ok) throw new Error("Server error " + res.status);
    return res.json();
  }

  function showResult(data) {
    if (data.steps.length) add("steps", data.steps.join("\n"));
    if (data.reply) add("msg bot", data.reply.replaceAll("**", ""));
    if (data.pending.length) askApproval(data.pending);
    refreshPanel();
  }

  function askApproval(pending) {
    const box = document.createElement("div");
    box.className = "approve";
    const p = document.createElement("p");
    p.textContent = "Delete this expense? " + pending.map(x => x.summary).join(" | ");
    const yes = document.createElement("button"); yes.className = "danger"; yes.textContent = "Delete";
    const no = document.createElement("button"); no.textContent = "Keep it";
    box.append(p, yes, no);
    log.appendChild(box);
    log.scrollTop = log.scrollHeight;

    const decide = async ok => {
      yes.disabled = no.disabled = true;
      box.remove();
      setBusy(true);
      try {
        showResult(await api("/api/resume", { thread_id: threadId, approvals: pending.map(() => ok) }));
      } catch (e) { add("msg bot", "Something went wrong: " + e.message); }
      setBusy(false);
    };
    yes.onclick = () => decide(true);
    no.onclick = () => decide(false);
  }

  function setBusy(busy) {
    sendBtn.disabled = input.disabled = busy;
    if (!busy) input.focus();
  }

  async function refreshPanel() {
    try {
      const data = await api("/api/expenses");
      document.getElementById("total").textContent = pkr(data.month.total);
      const cats = document.getElementById("categories");
      cats.replaceChildren();
      Object.entries(data.month.by_category).forEach(([name, total]) => {
        const row = document.createElement("div"); row.className = "row";
        const a = document.createElement("span"); a.textContent = name;
        const b = document.createElement("span"); b.textContent = pkr(total);
        row.append(a, b); cats.appendChild(row);
      });
      const recent = document.getElementById("recent");
      recent.replaceChildren();
      if (!data.recent.length) { recent.innerHTML = '<div class="empty">Nothing yet.</div>'; return; }
      data.recent.forEach(e => {
        const row = document.createElement("div"); row.className = "row";
        const left = document.createElement("span");
        left.textContent = e.note || e.category;
        const sub = document.createElement("small");
        sub.textContent = `#${e.id} · ${e.category} · ${e.date}`;
        left.appendChild(sub);
        const right = document.createElement("span"); right.textContent = pkr(e.amount);
        row.append(left, right); recent.appendChild(row);
      });
    } catch (_) { /* the side panel is a nice-to-have; ignore failures */ }
  }

  form.addEventListener("submit", async ev => {
    ev.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    add("msg user", text);
    setBusy(true);
    try {
      showResult(await api("/api/chat", { thread_id: threadId, message: text }));
    } catch (e) { add("msg bot", "Something went wrong: " + e.message); }
    setBusy(false);
  });

  (async () => {
    threadId = (await api("/api/new-thread")).thread_id;  // one id per page load = one conversation
    add("msg bot", "Hi! Tell me what you spent, or ask about your spending.");
    refreshPanel();
  })();
</script>
</body>
</html>
